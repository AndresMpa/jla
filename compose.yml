services:
  db:
    image: docker.io/postgres:16-alpine
    restart: unless-stopped
    container_name: jla-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobsearch}
      POSTGRES_USER: ${POSTGRES_USER:-jobs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobspass}
    volumes:
      - job_platform_pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - jla-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobs}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./job-search-automation
      dockerfile: Containerfile
    image: ${BACKEND_IMAGE:-jla-backend:latest}
    restart: unless-stopped
    container_name: jla-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      BACKEND_HOST: ${BACKEND_HOST:-0.0.0.0}
      DATABASE_URL: ${DATABASE_URL:-postgresql://jobs:jobspass@db:5432/jobsearch}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama-service:11434}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      PYTHONPATH: /app/src
    volumes:
      - ./job-search-automation/config.yaml:/app/config.yaml:Z
      - ./job-search-automation/profiles:/app/profiles:Z
      - ./job-search-automation/output:/app/output:Z
      - ./logs/backend:/app/logs:Z
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    command: ["uvicorn", "job_search.api:app", "--host", "0.0.0.0", "--port", "8000"]
    networks:
      - jla-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  frontend:
    build:
      context: ./job-listings-app
      dockerfile: Containerfile
    image: ${FRONTEND_IMAGE:-jla-frontend:latest}
    restart: unless-stopped
    container_name: jla-frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-http://backend:8000}
      NUXT_BACKEND_URL: ${NUXT_BACKEND_URL:-http://backend:8000}
      NUXT_TELEMETRY_DISABLED: 1
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      # The browser needs to open the CV/run progress WebSockets against
      # the backend directly (see composables/useProgressSocket.ts) -
      # NUXT_BACKEND_URL above is server-only and may point at a
      # docker-network-internal hostname the browser can't resolve.
      # Leaving NUXT_PUBLIC_BACKEND_WS_BASE unset falls back to
      # ws(s)://<page-host>:${BACKEND_PORT}, which matches this compose
      # file's default of exposing the backend port on the host; set it
      # explicitly if the backend is reachable at a different hostname.
      NUXT_PUBLIC_BACKEND_WS_BASE: ${NUXT_PUBLIC_BACKEND_WS_BASE:-}
      NUXT_PUBLIC_BACKEND_WS_PORT: ${BACKEND_PORT:-8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./logs/frontend:/app/logs:Z
    networks:
      - jla-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  job_platform_pgdata:
    name: jla_postgres_data

networks:
  jla-network:
    name: jla-network
    driver: bridge
